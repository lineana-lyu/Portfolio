name: Portfolio interface smoke test

on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'gallery.js'
      - 'assets/**'
      - 'downloads/**'
      - 'tests/**'
      - '.github/workflows/site-smoke.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate six views and screenshot bounds
        run: python tests/site_smoke.py
      - name: Upload visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-one-screen-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 14
